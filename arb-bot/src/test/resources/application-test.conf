arbbot {
  exchanges {
    binance {
      enabled = true
      restBaseUrl = "https://fapi.binance.com"
      wsBaseUrl = "wss://fstream.binance.com"
      feeRefreshIntervalMinutes = 30
      fundingRateRefreshIntervalMinutes = 5
    }
    kucoin {
      enabled = false
      restBaseUrl = "https://api-futures.kucoin.com"
      wsBaseUrl = ""
      feeRefreshIntervalMinutes = 30
      fundingRateRefreshIntervalMinutes = 5
    }
    bybit {
      enabled = true
      restBaseUrl = "https://api.bybit.com"
      wsBaseUrl = "wss://stream.bybit.com/v5/public/linear"
      feeRefreshIntervalMinutes = 30
      fundingRateRefreshIntervalMinutes = 5
    }
    okx {
      enabled = false
      restBaseUrl = "https://www.okx.com"
      wsBaseUrl = "wss://ws.okx.com:8443/ws/v5/public"
      feeRefreshIntervalMinutes = 30
      fundingRateRefreshIntervalMinutes = 5
    }
  }
  scanner {
    minNetSpreadPercent = 0.05
    maxGrossSpreadPercent = 3.0
    orderSizeUsdt = 1000
    scanIntervalMs = 50
    symbols = ["BTC", "ETH"]
  }
  risk {
    maxFundingRatePercent = 0.1
    minFundingTimeBufferMinutes = 5
  }
  health {
    checkIntervalSeconds = 30
    wsStaleThresholdMs = 2000
    endpointTimeoutMs = 5000
  }
  storage {
    dbPath = "data/test.db"
    flushIntervalMs = 1000
  }
}
