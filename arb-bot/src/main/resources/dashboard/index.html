<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ARB BOT</title>
<style>
  :root {
    --bg: #0d0f12; --bg2: #151820; --bg3: #1c2030; --border: #2a2f40;
    --text: #c8d0e0; --dim: #5a6070; --green: #00e676; --red: #ff4444;
    --yellow: #ffb300; --blue: #448aff; --teal: #00bcd4; --purple: #9c27b0;
    --green-glow: rgba(0,230,118,0.12); --red-glow: rgba(255,68,68,0.12);
    --yellow-glow: rgba(255,179,0,0.12);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--text); font-family: 'Courier New', monospace; font-size: 12px; overflow-x: hidden; }

  /* ── Header ── */
  #header { display: flex; align-items: center; gap: 16px; padding: 8px 16px; background: var(--bg2); border-bottom: 1px solid var(--border); position: sticky; top: 0; z-index: 100; }
  #header h1 { font-size: 14px; font-weight: bold; letter-spacing: 3px; color: var(--teal); }
  .live-badge { display: flex; align-items: center; gap: 5px; font-size: 10px; }
  .live-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--green); animation: pulse 1.5s infinite; }
  .live-dot.stale { background: var(--red); animation: none; }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.3} }
  .ex-pills { display: flex; gap: 8px; flex: 1; }
  .ex-pill { display: flex; align-items: center; gap: 4px; padding: 2px 8px; border-radius: 3px; background: var(--bg3); border: 1px solid var(--border); }
  .ex-pill .dot { width: 6px; height: 6px; border-radius: 50%; }
  .dot-green { background: var(--green); }
  .dot-yellow { background: var(--yellow); }
  .dot-red { background: var(--red); }
  #clock { margin-left: auto; color: var(--dim); font-size: 11px; }

  /* ── Main grid ── */
  #main { display: grid; grid-template-columns: 200px 1fr 260px; gap: 1px; background: var(--border); min-height: calc(100vh - 36px); }
  .col { background: var(--bg); overflow: hidden; }

  /* ── Section headers ── */
  .sec-title { padding: 6px 10px; background: var(--bg2); color: var(--teal); font-size: 10px; letter-spacing: 2px; border-bottom: 1px solid var(--border); }

  /* ── Exchange health ── */
  #health-list { padding: 6px; }
  .health-card { padding: 6px 8px; margin-bottom: 4px; border-radius: 4px; border: 1px solid var(--border); background: var(--bg2); }
  .health-name { font-size: 11px; font-weight: bold; color: var(--text); }
  .health-meta { color: var(--dim); font-size: 10px; margin-top: 2px; }
  .health-ok { border-left: 3px solid var(--green); }
  .health-warn { border-left: 3px solid var(--yellow); }
  .health-bad { border-left: 3px solid var(--red); }

  /* ── Ranking ── */
  #ranking { padding: 6px; }
  .rank-row { display: flex; align-items: center; gap: 6px; padding: 3px 6px; border-radius: 3px; margin-bottom: 2px; }
  .rank-num { color: var(--dim); width: 14px; }
  .rank-score { margin-left: auto; font-size: 10px; color: var(--teal); }

  /* ── Center column tabs ── */
  #center-tabs { display: flex; gap: 0; background: var(--bg2); border-bottom: 1px solid var(--border); }
  .tab { padding: 5px 12px; cursor: pointer; font-size: 10px; letter-spacing: 1px; color: var(--dim); border-bottom: 2px solid transparent; }
  .tab.active { color: var(--teal); border-bottom-color: var(--teal); }

  /* ── Spread matrix ── */
  #spreads-table { width: 100%; border-collapse: collapse; }
  #spreads-table th { padding: 4px 8px; text-align: left; color: var(--dim); font-size: 10px; letter-spacing: 1px; border-bottom: 1px solid var(--border); background: var(--bg2); }
  #spreads-table td { padding: 3px 8px; border-bottom: 1px solid var(--border); transition: background 0.3s; }
  .row-viable { background: var(--green-glow); }
  .row-neg { opacity: 0.5; }
  .spread-val { font-weight: bold; }
  .spread-pos { color: var(--green); }
  .spread-neg { color: var(--red); }
  .spread-zero { color: var(--dim); }

  /* ── Funding grid ── */
  #funding-grid { display: grid; gap: 1px; background: var(--border); }
  .fund-cell { padding: 5px 8px; background: var(--bg); text-align: center; }
  .fund-val { font-weight: bold; }
  .fund-pos { color: var(--red); }
  .fund-neg { color: var(--blue); }
  .fund-zero { color: var(--dim); }
  .fund-countdown { font-size: 9px; color: var(--dim); margin-top: 1px; }

  /* ── Order book depth ── */
  #ob-tabs { display: flex; gap: 0; background: var(--bg2); border-bottom: 1px solid var(--border); }
  #ob-grid { display: grid; gap: 1px; background: var(--border); }
  .ob-col { background: var(--bg); }
  .ob-exname { padding: 4px 8px; background: var(--bg2); color: var(--teal); font-size: 10px; letter-spacing: 1px; text-align: center; }
  .ob-asks, .ob-bids { }
  .ob-level { display: flex; align-items: center; padding: 2px 8px; gap: 6px; }
  .ob-price { width: 90px; text-align: right; }
  .ob-qty { width: 70px; color: var(--dim); }
  .ob-bar { flex: 1; height: 6px; border-radius: 2px; }
  .ask-price { color: var(--red); }
  .bid-price { color: var(--green); }
  .ask-bar { background: rgba(255,68,68,0.25); }
  .bid-bar { background: rgba(0,230,118,0.25); }
  .ob-spread-row { padding: 3px 8px; background: var(--bg2); text-align: center; font-size: 10px; color: var(--yellow); border-top: 1px solid var(--border); border-bottom: 1px solid var(--border); }

  /* ── Sparklines ── */
  #sparklines { display: flex; flex-wrap: wrap; gap: 8px; padding: 8px; background: var(--bg); }
  .spark-card { background: var(--bg2); border: 1px solid var(--border); border-radius: 4px; padding: 6px 8px; flex: 1; min-width: 130px; }
  .spark-title { font-size: 10px; color: var(--dim); margin-bottom: 4px; }
  .spark-val { font-size: 11px; font-weight: bold; margin-bottom: 3px; }

  /* ── Right column ── */
  #opps-list { height: calc(60vh - 60px); overflow-y: auto; }
  .opp-row { padding: 5px 8px; border-bottom: 1px solid var(--border); transition: background 0.3s; }
  .opp-row:hover { background: var(--bg2); }
  .opp-sym { font-weight: bold; color: var(--teal); }
  .opp-pair { color: var(--dim); }
  .opp-net { font-weight: bold; }
  .opp-time { font-size: 10px; color: var(--dim); float: right; }
  .net-high { color: var(--green); background: var(--green-glow); }
  .net-med { color: var(--yellow); }
  .net-low { color: var(--dim); }

  /* ── Stats ── */
  #stats-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 1px; background: var(--border); }
  .stat-cell { background: var(--bg); padding: 8px; text-align: center; }
  .stat-val { font-size: 16px; font-weight: bold; color: var(--teal); }
  .stat-lbl { font-size: 9px; color: var(--dim); margin-top: 2px; letter-spacing: 1px; }

  /* ── Flash animations ── */
  @keyframes flash-green { 0%{background:rgba(0,230,118,0.3)} 100%{background:transparent} }
  @keyframes flash-red { 0%{background:rgba(255,68,68,0.3)} 100%{background:transparent} }
  .flash-g { animation: flash-green 0.4s ease-out; }
  .flash-r { animation: flash-red 0.4s ease-out; }

  /* ── Scrollbar ── */
  ::-webkit-scrollbar { width: 4px; } ::-webkit-scrollbar-track { background: var(--bg); } ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }
</style>
</head>
<body>

<!-- Header -->
<div id="header">
  <h1>ARB BOT</h1>
  <div class="live-badge"><div class="live-dot" id="live-dot"></div><span id="live-txt">CONNECTING</span></div>
  <div class="ex-pills" id="ex-pills"></div>
  <div id="clock">--:--:--</div>
</div>

<!-- Main 3-column grid -->
<div id="main">

  <!-- Left column -->
  <div class="col">
    <div class="sec-title">EXCHANGE HEALTH</div>
    <div id="health-list"></div>
    <div class="sec-title">RANKING</div>
    <div id="ranking"></div>
  </div>

  <!-- Center column -->
  <div class="col">
    <div id="center-tabs">
      <div class="tab active" onclick="setTab('spreads')">SPREADS</div>
      <div class="tab" onclick="setTab('funding')">FUNDING</div>
      <div class="tab" onclick="setTab('depth')">DEPTH</div>
      <div class="tab" onclick="setTab('history')">HISTORY</div>
    </div>

    <!-- SPREADS panel -->
    <div id="panel-spreads">
      <div style="padding:6px; overflow-x:auto; max-height:calc(60vh - 60px); overflow-y:auto;">
        <table id="spreads-table">
          <thead><tr><th>SYMBOL</th><th>LONG</th><th>SHORT</th><th>GROSS%</th><th>NET%</th></tr></thead>
          <tbody id="spreads-body"></tbody>
        </table>
      </div>
      <div class="sec-title">SPREAD HISTORY</div>
      <div id="sparklines"></div>
    </div>

    <!-- FUNDING panel -->
    <div id="panel-funding" style="display:none">
      <div style="padding:8px; overflow:auto; max-height:calc(80vh - 60px);">
        <div id="funding-grid"></div>
      </div>
    </div>

    <!-- DEPTH panel -->
    <div id="panel-depth" style="display:none">
      <div id="ob-tabs"></div>
      <div style="overflow:auto; max-height:calc(80vh - 90px);">
        <div id="ob-grid"></div>
      </div>
    </div>

    <!-- HISTORY panel -->
    <div id="panel-history" style="display:none">
      <div style="padding:6px; overflow:auto; max-height:calc(80vh - 60px);">
        <table id="spreads-table" style="width:100%">
          <thead><tr><th>SYMBOL</th><th>LONG→SHORT</th><th>LONG ASK</th><th>SHORT BID</th><th>GROSS%</th><th>NET%</th><th>TIME</th></tr></thead>
          <tbody id="history-body"></tbody>
        </table>
      </div>
    </div>
  </div>

  <!-- Right column -->
  <div class="col">
    <div class="sec-title">RECENT OPPORTUNITIES</div>
    <div id="opps-list"></div>
    <div class="sec-title">STATISTICS</div>
    <div id="stats-grid"></div>
  </div>

</div>

<script>
// ── State ──────────────────────────────────────────────────────────────────
let lastSnap = null;
let prevPrices = {};  // symbol+exchange → {bid, ask} for flash detection
let activeTab = 'spreads';
let obSymbol = null;
let history = {};     // symbol+pair → [net%, ...] rolling 60 ticks
let settlData = {};   // exchange+symbol → nextSettlementMs
let countdownInterval = null;
const MAX_HIST = 60;

// ── SSE ────────────────────────────────────────────────────────────────────
const es = new EventSource('/api/stream');
es.onopen = () => {
  document.getElementById('live-dot').className = 'live-dot';
  document.getElementById('live-txt').textContent = 'LIVE';
};
es.onerror = () => {
  document.getElementById('live-dot').className = 'live-dot stale';
  document.getElementById('live-txt').textContent = 'RECONNECTING';
};
es.onmessage = e => {
  const snap = JSON.parse(e.data);
  lastSnap = snap;
  render(snap);
};

// ── Clock ──────────────────────────────────────────────────────────────────
setInterval(() => {
  const now = new Date();
  document.getElementById('clock').textContent =
    now.toTimeString().slice(0, 8);
}, 500);

// ── Countdowns ─────────────────────────────────────────────────────────────
countdownInterval = setInterval(() => {
  const now = Date.now();
  document.querySelectorAll('[data-settl]').forEach(el => {
    const ms = parseInt(el.dataset.settl) - now;
    el.textContent = ms > 0 ? fmtCountdown(ms) : 'NOW';
  });
}, 1000);

function fmtCountdown(ms) {
  if (ms < 0) return 'NOW';
  const h = Math.floor(ms / 3600000);
  const m = Math.floor((ms % 3600000) / 60000);
  const s = Math.floor((ms % 60000) / 1000);
  if (h > 0) return `${h}h${String(m).padStart(2,'0')}m`;
  return `${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
}

// ── Tab switching ──────────────────────────────────────────────────────────
function setTab(name) {
  activeTab = name;
  document.querySelectorAll('#center-tabs .tab').forEach(t => t.classList.remove('active'));
  event.target.classList.add('active');
  ['spreads','funding','depth','history'].forEach(p =>
    document.getElementById('panel-'+p).style.display = p === name ? '' : 'none');
  if (name === 'depth' && lastSnap) renderDepth(lastSnap.prices);
}

// ── Main render ────────────────────────────────────────────────────────────
function render(snap) {
  renderHeader(snap.health);
  renderHealth(snap.health);
  renderRanking(snap.health);
  renderSpreads(snap.spreads, snap.prices);
  renderFunding(snap.prices);
  if (activeTab === 'depth') renderDepth(snap.prices);
  updateSparklines(snap.spreads);
  renderOpps(snap.recentOpportunities);
  renderHistory(snap.recentOpportunities);
  renderStats(snap.stats);
}

// ── Header pills ──────────────────────────────────────────────────────────
function renderHeader(health) {
  const el = document.getElementById('ex-pills');
  el.innerHTML = health.map(h => {
    const cls = h.dataStale ? 'dot-red' : (!h.restAlive ? 'dot-red' : 'dot-green');
    return `<div class="ex-pill"><div class="dot ${cls}"></div><span>${h.exchange.toUpperCase().slice(0,3)}</span></div>`;
  }).join('');
}

// ── Health cards ──────────────────────────────────────────────────────────
function renderHealth(health) {
  const el = document.getElementById('health-list');
  el.innerHTML = health.map(h => {
    const cls = h.dataStale ? 'health-bad' : (!h.restAlive ? 'health-bad' : (h.wsAlive ? 'health-ok' : 'health-warn'));
    const wsAge = h.lastWsTickAgeMs >= 0 ? (h.lastWsTickAgeMs / 1000).toFixed(1) + 's' : '—';
    const latency = h.restLatencyMs >= 0 ? h.restLatencyMs + 'ms' : '—';
    const status = h.dataStale ? 'STALE' : (h.restAlive ? (h.wsAlive ? 'LIVE' : 'WS DOWN') : 'REST DOWN');
    return `<div class="health-card ${cls}">
      <div class="health-name">${h.exchange.toUpperCase()} <span style="color:var(--dim);font-weight:normal;font-size:10px">${status}</span></div>
      <div class="health-meta">REST ${latency} · WS tick ${wsAge} ago</div>
    </div>`;
  }).join('');
}

// ── Exchange ranking ───────────────────────────────────────────────────────
function renderRanking(health) {
  const scored = health.map(h => ({
    ex: h.exchange,
    score: (h.restAlive ? 2 : 0) + (!h.dataStale ? 1 : 0) - Math.min(1, h.restLatencyMs / 1000)
  })).sort((a,b) => b.score - a.score);
  document.getElementById('ranking').innerHTML = scored.map((r,i) => {
    const col = r.score >= 2.5 ? 'var(--green)' : r.score >= 1 ? 'var(--yellow)' : 'var(--red)';
    return `<div class="rank-row">
      <span class="rank-num">${i+1}</span>
      <span style="color:${col}">${r.ex.toUpperCase()}</span>
      <span class="rank-score">${r.score.toFixed(1)}</span>
    </div>`;
  }).join('');
}

// ── Spread matrix ──────────────────────────────────────────────────────────
function renderSpreads(spreads, prices) {
  const body = document.getElementById('spreads-body');
  body.innerHTML = spreads.slice(0, 40).map(r => {
    const rowCls = r.viable ? 'row-viable' : (r.netSpreadPct < 0 ? 'row-neg' : '');
    const netCls = r.netSpreadPct > 0.1 ? 'spread-pos' : r.netSpreadPct > 0 ? 'spread-zero' : 'spread-neg';
    const grossCls = r.grossSpreadPct > 0 ? 'spread-pos' : 'spread-neg';
    return `<tr class="${rowCls}">
      <td><b style="color:var(--teal)">${r.symbol}</b></td>
      <td>${r.longExchange}</td>
      <td>${r.shortExchange}</td>
      <td class="${grossCls}">${fmt2(r.grossSpreadPct)}%</td>
      <td class="spread-val ${netCls}">${fmt2(r.netSpreadPct)}%</td>
    </tr>`;
  }).join('');
}

// ── Funding grid ───────────────────────────────────────────────────────────
function renderFunding(prices) {
  if (activeTab !== 'funding') return;
  const allExchanges = [...new Set(prices.flatMap(s => s.funding.map(f => f.exchange)))];
  const allSymbols = prices.map(s => s.symbol);
  settlData = {};
  const cols = allExchanges.length + 1;
  let html = `<div style="display:grid;grid-template-columns:60px ${allExchanges.map(()=>'1fr').join(' ')};gap:1px;background:var(--border)">`;
  html += `<div class="fund-cell" style="background:var(--bg2)"></div>`;
  allExchanges.forEach(ex => html += `<div class="fund-cell" style="background:var(--bg2);color:var(--teal)">${ex.toUpperCase()}</div>`);
  prices.forEach(sym => {
    html += `<div class="fund-cell" style="background:var(--bg2);color:var(--teal)">${sym.symbol}</div>`;
    allExchanges.forEach(ex => {
      const f = sym.funding.find(x => x.exchange === ex);
      if (!f) { html += `<div class="fund-cell"><span class="fund-val fund-zero">—</span></div>`; return; }
      const pct = (f.currentRate * 100).toFixed(4);
      const cls = f.currentRate > 0.0001 ? 'fund-pos' : f.currentRate < -0.0001 ? 'fund-neg' : 'fund-zero';
      const key = ex + ':' + sym.symbol;
      if (f.nextSettlementMs > 0) settlData[key] = f.nextSettlementMs;
      const countdown = f.nextSettlementMs > 0
        ? `<div class="fund-countdown" data-settl="${f.nextSettlementMs}">${fmtCountdown(f.nextSettlementMs - Date.now())}</div>`
        : '';
      html += `<div class="fund-cell"><span class="fund-val ${cls}">${pct}%</span>${countdown}</div>`;
    });
  });
  html += '</div>';
  document.getElementById('funding-grid').innerHTML = html;
}

// ── Order book depth ───────────────────────────────────────────────────────
function renderDepth(prices) {
  const tabs = document.getElementById('ob-tabs');
  if (!obSymbol || !prices.find(s => s.symbol === obSymbol)) {
    obSymbol = prices[0]?.symbol;
  }
  tabs.innerHTML = prices.map(s =>
    `<div class="tab ${s.symbol === obSymbol ? 'active' : ''}" onclick="obSymbol='${s.symbol}';renderDepth(lastSnap.prices)">${s.symbol}</div>`
  ).join('');

  const sym = prices.find(s => s.symbol === obSymbol);
  if (!sym) return;
  const grid = document.getElementById('ob-grid');
  const n = sym.ticks.length;
  grid.style.gridTemplateColumns = `repeat(${n}, 1fr)`;

  // Find max qty for bar scaling
  let maxQty = 0;
  sym.ticks.forEach(t => {
    [...(t.topBids||[]), ...(t.topAsks||[])].forEach(([,q]) => { if(q > maxQty) maxQty = q; });
  });

  grid.innerHTML = sym.ticks.map(t => {
    const spread = t.bestAsk > 0 && t.bestBid > 0
      ? ((t.bestAsk - t.bestBid) / t.bestAsk * 100).toFixed(3) + '%'
      : '—';
    const asks = [...(t.topAsks||[])].reverse(); // show highest ask first (top of book ascending reversed)
    const bids = t.topBids||[];
    const askRows = asks.map(([p,q]) => {
      const w = maxQty > 0 ? Math.round(q / maxQty * 100) : 0;
      return `<div class="ob-level">
        <div class="ob-bar ask-bar" style="width:${w}%"></div>
        <div class="ob-qty">${fmtQty(q)}</div>
        <div class="ob-price ask-price">${fmtPrice(p)}</div>
      </div>`;
    }).join('');
    const bidRows = bids.map(([p,q]) => {
      const w = maxQty > 0 ? Math.round(q / maxQty * 100) : 0;
      return `<div class="ob-level">
        <div class="ob-price bid-price">${fmtPrice(p)}</div>
        <div class="ob-qty">${fmtQty(q)}</div>
        <div class="ob-bar bid-bar" style="width:${w}%"></div>
      </div>`;
    }).join('');
    return `<div class="ob-col">
      <div class="ob-exname">${t.exchange.toUpperCase()}</div>
      <div class="ob-asks">${askRows}</div>
      <div class="ob-spread-row">spread ${spread}</div>
      <div class="ob-bids">${bidRows}</div>
    </div>`;
  }).join('');
}

// ── Sparklines ────────────────────────────────────────────────────────────
function updateSparklines(spreads) {
  // Track best net spread per symbol
  const best = {};
  spreads.forEach(r => {
    if (!best[r.symbol] || r.netSpreadPct > best[r.symbol]) best[r.symbol] = r.netSpreadPct;
  });
  Object.entries(best).forEach(([sym, val]) => {
    if (!history[sym]) history[sym] = [];
    history[sym].push(val);
    if (history[sym].length > MAX_HIST) history[sym].shift();
  });
  renderSparklines();
}

function renderSparklines() {
  const el = document.getElementById('sparklines');
  el.innerHTML = Object.entries(history).map(([sym, vals]) => {
    const last = vals[vals.length - 1] || 0;
    const cls = last > 0.1 ? 'spread-pos' : last > 0 ? 'spread-zero' : 'spread-neg';
    const svg = makeSvg(vals);
    return `<div class="spark-card">
      <div class="spark-title">${sym} BEST NET</div>
      <div class="spark-val ${cls}">${fmt2(last)}%</div>
      ${svg}
    </div>`;
  }).join('');
}

function makeSvg(vals) {
  if (vals.length < 2) return '<svg width="100%" height="30"></svg>';
  const min = Math.min(...vals);
  const max = Math.max(...vals);
  const range = max - min || 0.0001;
  const w = 120, h = 30;
  const pts = vals.map((v, i) => {
    const x = (i / (vals.length - 1)) * w;
    const y = h - ((v - min) / range) * (h - 4) - 2;
    return `${x.toFixed(1)},${y.toFixed(1)}`;
  }).join(' ');
  const color = vals[vals.length-1] > 0.05 ? '#00e676' : vals[vals.length-1] > 0 ? '#ffb300' : '#ff4444';
  return `<svg viewBox="0 0 ${w} ${h}" width="100%" height="30" preserveAspectRatio="none">
    <polyline points="${pts}" fill="none" stroke="${color}" stroke-width="1.5" stroke-linejoin="round"/>
  </svg>`;
}

// ── Opportunities feed ────────────────────────────────────────────────────
function renderOpps(opps) {
  const el = document.getElementById('opps-list');
  if (!opps || opps.length === 0) {
    el.innerHTML = '<div style="padding:20px;text-align:center;color:var(--dim)">Waiting for opportunities...</div>';
    return;
  }
  el.innerHTML = opps.map(o => {
    const netCls = o.netPct > 0.1 ? 'opp-net net-high' : o.netPct > 0.05 ? 'opp-net net-med' : 'opp-net net-low';
    const age = fmtAge(Date.now() - o.detectedAtMs);
    return `<div class="opp-row">
      <span class="opp-sym">${o.symbol}</span>
      <span class="opp-time">${age}</span><br>
      <span class="opp-pair">${o.longExchange}→${o.shortExchange}</span>
      <span class="${netCls}" style="float:right">${fmt2(o.netPct)}%</span>
    </div>`;
  }).join('');
}

// ── History table ─────────────────────────────────────────────────────────
function renderHistory(opps) {
  if (activeTab !== 'history') return;
  const body = document.getElementById('history-body');
  if (!opps || opps.length === 0) { body.innerHTML = '<tr><td colspan="7" style="padding:20px;text-align:center;color:var(--dim)">No data</td></tr>'; return; }
  body.innerHTML = opps.map(o => {
    const netCls = o.netPct > 0.1 ? 'spread-pos' : o.netPct > 0.05 ? 'spread-zero' : 'spread-neg';
    return `<tr>
      <td><b style="color:var(--teal)">${o.symbol}</b></td>
      <td>${o.longExchange}→${o.shortExchange}</td>
      <td>${fmtPrice(o.longAsk)}</td>
      <td>${fmtPrice(o.shortBid)}</td>
      <td class="spread-pos">${fmt2(o.grossPct)}%</td>
      <td class="${netCls}">${fmt2(o.netPct)}%</td>
      <td style="color:var(--dim)">${fmtAge(Date.now()-o.detectedAtMs)}</td>
    </tr>`;
  }).join('');
}

// ── Stats ─────────────────────────────────────────────────────────────────
function renderStats(stats) {
  if (!stats) return;
  const cells = [
    { val: stats.totalOpportunities, lbl: 'TOTAL OPPS' },
    { val: fmt2(stats.maxNetSpreadPct) + '%', lbl: 'MAX NET' },
    { val: fmt2(stats.avgNetSpreadPct) + '%', lbl: 'AVG NET' },
    { val: Object.keys(stats.countBySymbol || {}).length, lbl: 'SYMBOLS' },
  ];
  document.getElementById('stats-grid').innerHTML = cells.map(c =>
    `<div class="stat-cell"><div class="stat-val">${c.val}</div><div class="stat-lbl">${c.lbl}</div></div>`
  ).join('');
}

// ── Formatters ────────────────────────────────────────────────────────────
function fmt2(v) { return (v || 0).toFixed(3); }
function fmtPrice(p) {
  if (!p || p === 0) return '—';
  return p < 10 ? p.toFixed(4) : p < 1000 ? p.toFixed(2) : p.toFixed(1);
}
function fmtQty(q) {
  if (q >= 1000) return (q/1000).toFixed(1)+'k';
  return q.toFixed(q < 1 ? 3 : 1);
}
function fmtAge(ms) {
  if (ms < 60000) return Math.floor(ms/1000) + 's';
  if (ms < 3600000) return Math.floor(ms/60000) + 'm';
  return Math.floor(ms/3600000) + 'h';
}
</script>
