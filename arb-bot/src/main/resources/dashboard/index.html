<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ARB BOT</title>
<style>
  :root {
    --bg:    #0b0e11;
    --bg2:   #161a1e;
    --bg3:   #1e2329;
    --border:#2b3139;
    --text:  #eaecef;
    --dim:   #848e9c;
    --green: #0ecb81;
    --red:   #f6465d;
    --yellow:#f0b90b;
    --blue:  #3498db;
    --teal:  #00b8d9;
    --green-bg:    rgba(14,203,129,0.07);
    --expired-bg:  rgba(132,142,156,0.07);
    --red-depth:   rgba(246,70,93,0.14);
    --green-depth: rgba(14,203,129,0.14);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Roboto Mono', 'Courier New', monospace;
    font-size: 12px;
  }

  /* ── Header ───────────────────────────────────────────────────────── */
  #header {
    display: flex; align-items: center; gap: 14px;
    padding: 7px 16px;
    background: var(--bg2);
    border-bottom: 1px solid var(--border);
    position: sticky; top: 0; z-index: 200;
  }
  #header h1 { font-size: 13px; letter-spacing: 3px; color: var(--teal); }
  .live-badge { display: flex; align-items: center; gap: 5px; font-size: 10px; color: var(--dim); }
  .live-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--green); animation: pulse 1.5s infinite; }
  .live-dot.stale { background: var(--red); animation: none; }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.3} }
  .ex-pills { display: flex; gap: 6px; }
  .ex-pill { display: flex; align-items: center; gap: 4px; padding: 2px 8px; border-radius: 3px; background: var(--bg3); border: 1px solid var(--border); font-size: 10px; }
  .ex-pill .dot { width: 6px; height: 6px; border-radius: 50%; }
  .dot-g { background: var(--green); }
  .dot-y { background: var(--yellow); }
  .dot-r { background: var(--red); }
  #clock { margin-left: auto; color: var(--dim); font-size: 11px; min-width: 60px; text-align: right; }

  /* ── Section title ─────────────────────────────────────────────────── */
  .sec-title {
    padding: 5px 12px;
    background: var(--bg3);
    color: var(--teal);
    font-size: 10px; letter-spacing: 2px;
    border-bottom: 1px solid var(--border);
  }

  /* ── Health row ────────────────────────────────────────────────────── */
  #health-row {
    display: flex; gap: 8px;
    padding: 8px 12px;
    background: var(--bg2);
    border-bottom: 1px solid var(--border);
    overflow-x: auto;
  }
  .health-card {
    display: flex; align-items: center; gap: 10px;
    flex: 1; min-width: 190px;
    padding: 6px 12px;
    background: var(--bg3);
    border: 1px solid var(--border);
    border-radius: 4px;
  }
  .health-card.ok   { border-left: 3px solid var(--green); }
  .health-card.warn { border-left: 3px solid var(--yellow); }
  .health-card.bad  { border-left: 3px solid var(--red); }
  .h-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
  .h-name   { font-weight: bold; font-size: 11px; }
  .h-status { font-size: 10px; color: var(--dim); margin-top: 1px; }
  .h-meta   { margin-left: auto; font-size: 10px; color: var(--dim); text-align: right; line-height: 1.5; }

  /* ── Spreads + Funding ─────────────────────────────────────────────── */
  #mid-row {
    display: grid;
    grid-template-columns: 1.15fr 1fr;
    gap: 1px;
    background: var(--border);
    border-bottom: 1px solid var(--border);
  }
  .mid-panel { background: var(--bg); }

  #spreads-wrap { max-height: 280px; overflow-y: auto; }
  #spreads-table { width: 100%; border-collapse: collapse; }
  #spreads-table th {
    padding: 4px 10px; text-align: left;
    color: var(--dim); font-size: 10px; letter-spacing: 1px;
    background: var(--bg2); border-bottom: 1px solid var(--border);
    position: sticky; top: 0; z-index: 1;
  }
  #spreads-table td { padding: 3px 10px; border-bottom: 1px solid var(--border); }
  .row-viable { background: var(--green-bg); }
  .row-neg    { opacity: 0.4; }
  .net-pos  { color: var(--green); font-weight: bold; }
  .net-neg  { color: var(--red); }
  .net-dim  { color: var(--dim); }

  #funding-inner { max-height: 280px; overflow: auto; }
  .fund-grid { display: grid; gap: 1px; background: var(--border); }
  .fund-cell { padding: 5px 8px; background: var(--bg); text-align: center; }
  .fund-hdr  { background: var(--bg2); color: var(--teal); font-size: 10px; letter-spacing: 1px; }
  .fv-pos  { color: var(--red);  font-weight: bold; }
  .fv-neg  { color: var(--blue); font-weight: bold; }
  .fv-zero { color: var(--dim);  font-weight: bold; }
  .fund-cd { font-size: 9px; color: var(--dim); margin-top: 2px; }

  /* ── Shared opp table styles ────────────────────────────────────────── */
  .opp-table { width: 100%; border-collapse: collapse; }
  .opp-table th {
    padding: 4px 12px; text-align: left;
    color: var(--dim); font-size: 10px; letter-spacing: 1px;
    background: var(--bg2); border-bottom: 1px solid var(--border);
    position: sticky; top: 0; z-index: 1;
  }
  .opp-table td { padding: 5px 12px; border-bottom: 1px solid var(--border); vertical-align: middle; }
  .opp-sym  { color: var(--teal); font-weight: bold; }
  .opp-pair { color: var(--dim); }
  .no-opps  { padding: 14px 12px; color: var(--dim); text-align: center; }

  /* ── Active opportunity rows ────────────────────────────────────────── */
  .opp-active  { background: var(--green-bg); }
  .opp-expired {
    background: var(--expired-bg);
    opacity: 0.6;
  }
  .expired-badge {
    display: inline-block;
    padding: 1px 5px;
    border-radius: 3px;
    background: var(--bg3);
    color: var(--dim);
    font-size: 10px;
    border: 1px solid var(--border);
    margin-left: 6px;
    vertical-align: middle;
  }

  /* ── History section ────────────────────────────────────────────────── */
  #history-section { border-bottom: 1px solid var(--border); }
  #history-wrap { max-height: 240px; overflow-y: auto; }

  /* ── Order books ────────────────────────────────────────────────────── */
  #ob-section { border-bottom: 1px solid var(--border); }
  #ob-sym-tabs {
    display: flex;
    background: var(--bg2);
    border-bottom: 1px solid var(--border);
  }
  .sym-tab {
    padding: 5px 16px; cursor: pointer;
    font-size: 10px; letter-spacing: 1px;
    color: var(--dim);
    border-bottom: 2px solid transparent;
  }
  .sym-tab:hover { color: var(--text); }
  .sym-tab.active { color: var(--teal); border-bottom-color: var(--teal); }

  #ob-books {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
    gap: 1px;
    background: var(--border);
  }
  .ob-panel { background: var(--bg); }
  .ob-ex-hdr {
    padding: 5px 10px;
    background: var(--bg2);
    color: var(--teal);
    font-size: 10px; letter-spacing: 2px;
    text-align: center;
    border-bottom: 1px solid var(--border);
  }
  .ob-col-hdr {
    display: grid; grid-template-columns: 1fr auto auto;
    padding: 3px 8px; gap: 6px;
    color: var(--dim); font-size: 10px;
    background: var(--bg2);
    border-bottom: 1px solid var(--border);
  }
  .ob-col-hdr span { text-align: right; }
  .ob-col-hdr span:first-child { text-align: left; }

  .ob-row {
    display: grid; grid-template-columns: 1fr auto auto;
    padding: 2px 8px; gap: 6px;
  }
  .ob-row span { text-align: right; position: relative; z-index: 1; }
  .ob-row span:first-child { text-align: left; position: relative; z-index: 1; }
  .ob-row.ask-row {
    background: linear-gradient(to left,
      var(--red-depth) var(--d, 0%),
      transparent var(--d, 0%));
  }
  .ob-row.bid-row {
    background: linear-gradient(to left,
      var(--green-depth) var(--d, 0%),
      transparent var(--d, 0%));
  }
  .ask-price { color: var(--red); }
  .bid-price { color: var(--green); }
  .ob-qty    { color: var(--dim); }
  .ob-total  { color: var(--dim); }

  .ob-mid {
    display: flex; align-items: center; justify-content: space-between;
    padding: 5px 8px;
    background: var(--bg3);
    border-top: 1px solid var(--border);
    border-bottom: 1px solid var(--border);
  }
  .ob-mid-price  { font-size: 13px; font-weight: bold; }
  .ob-mid-spread { font-size: 10px; color: var(--yellow); }

  /* ── Stats bar ──────────────────────────────────────────────────────── */
  #stats-bar {
    display: flex; gap: 1px;
    background: var(--border);
    border-top: 1px solid var(--border);
  }
  .stat-cell { flex: 1; background: var(--bg2); padding: 10px 12px; text-align: center; }
  .stat-val  { font-size: 18px; font-weight: bold; color: var(--teal); }
  .stat-lbl  { font-size: 9px; color: var(--dim); letter-spacing: 1px; margin-top: 2px; }

  /* ── System stats banner ────────────────────────────────────────────── */
  #sys-stats-banner {
    display: flex; align-items: center; gap: 0;
    padding: 6px 14px;
    background: var(--bg2);
    border-bottom: 1px solid var(--border);
    overflow-x: auto;
    flex-wrap: wrap;
    gap: 14px;
  }
  .ss-divider { width: 1px; height: 30px; background: var(--border); flex-shrink: 0; }
  .ss-label { font-size: 9px; text-transform: uppercase; letter-spacing: 1px; color: var(--dim); }
  /* CPU / GPU ring */
  .ss-ring-wrap { display: flex; align-items: center; gap: 8px; }
  .ss-ring-col { display: flex; flex-direction: column; gap: 2px; }
  .ss-ring { position: relative; width: 38px; height: 38px; flex-shrink: 0; }
  .ss-ring svg { transform: rotate(-90deg); }
  .ss-ring-pct {
    position: absolute; top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    font-size: 9px; font-weight: bold;
  }
  .ss-sub { font-size: 9px; color: var(--dim); }
  /* RAM bar */
  .ss-ram-wrap { display: flex; flex-direction: column; gap: 3px; min-width: 110px; }
  .ss-ram-top { display: flex; justify-content: space-between; align-items: center; }
  .ss-ram-val { font-size: 10px; font-weight: bold; }
  .ss-bar-track { height: 4px; background: var(--bg3); border-radius: 2px; }
  .ss-bar-fill  { height: 100%; border-radius: 2px; transition: width 0.4s; }
  .ss-ram-foot { display: flex; justify-content: space-between; }
  /* Network */
  .ss-net-wrap { display: flex; flex-direction: column; gap: 3px; min-width: 140px; }
  .ss-net-top  { display: flex; justify-content: space-between; align-items: center; }
  .ss-net-rates { display: flex; gap: 14px; }
  .ss-net-rate  { display: flex; align-items: center; gap: 3px; }
  .ss-net-val   { font-size: 11px; font-weight: bold; }
  .ss-net-unit  { font-size: 9px; color: var(--dim); }
  .ss-net-bar-track { height: 3px; background: var(--bg3); border-radius: 1px; }
  .ss-net-bar-fill  { height: 100%; border-radius: 1px; transition: width 0.4s; }
  .ss-net-foot  { display: flex; justify-content: space-between; align-items: center; }
  .ss-badge {
    font-size: 9px; padding: 1px 6px; border-radius: 3px; font-weight: bold;
  }
  .ss-badge-ok  { background: rgba(14,203,129,0.15); color: var(--green); }
  .ss-badge-hi  { background: rgba(240,185,11,0.15);  color: var(--yellow); }
  .ss-badge-sat { background: rgba(246,70,93,0.15);   color: var(--red); }

  /* ── Misc ───────────────────────────────────────────────────────────── */
  ::-webkit-scrollbar { width: 4px; height: 4px; }
  ::-webkit-scrollbar-track { background: var(--bg); }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }
</style>
</head>
<body>

<!-- Header -->
<div id="header">
  <h1>ARB BOT</h1>
  <div class="live-badge">
    <div class="live-dot" id="live-dot"></div>
    <span id="live-txt">CONNECTING</span>
  </div>
  <div class="ex-pills" id="ex-pills"></div>
  <div id="clock"></div>
</div>

<!-- System stats banner -->
<div id="sys-stats-banner"></div>

<!-- Exchange health -->
<div id="health-row"></div>

<!-- Spreads + Funding -->
<div id="mid-row">
  <div class="mid-panel">
    <div class="sec-title">LIVE SPREADS</div>
    <div id="spreads-wrap">
      <table id="spreads-table">
        <thead><tr>
          <th>SYMBOL</th><th>LONG</th><th>SHORT</th><th>GROSS%</th><th>NET%</th><th>MAX VOL</th>
        </tr></thead>
        <tbody id="spreads-body"></tbody>
      </table>
    </div>
  </div>
  <div class="mid-panel">
    <div class="sec-title">FUNDING RATES</div>
    <div id="funding-inner"><div id="funding-grid"></div></div>
  </div>
</div>

<!-- Active opportunities (live + cooling-down) -->
<div id="opps-section">
  <div class="sec-title">ACTIVE OPPORTUNITIES</div>
  <div id="opps-inner"><div class="no-opps">Watching for opportunities…</div></div>
</div>

<!-- Opportunity history -->
<div id="history-section">
  <div class="sec-title">OPPORTUNITY HISTORY</div>
  <div id="history-wrap">
    <div class="no-opps">No completed opportunities yet</div>
  </div>
</div>

<!-- Order books -->
<div id="ob-section">
  <div id="ob-sym-tabs"></div>
  <div id="ob-books"></div>
</div>

<!-- Stats footer -->
<div id="stats-bar"></div>

<script>
// ── Constants ─────────────────────────────────────────────────────────────
const EXPIRED_DISPLAY_MS = 10_000;   // keep expired opp in active section for 10 s
const MAX_HIST_TICKS     = 150;      // ~30 s of SSE ticks per opp
const MAX_HISTORY_ROWS   = 100;      // max rows in history table

// ── State ─────────────────────────────────────────────────────────────────
let lastSnap    = null;
let obSymbol    = null;
let lastSymList = '';
// DB-backed sessions keyed by id (prevents duplicates from repeated SSE ticks)
const dbSessions = new Map();

/**
 * activeOpps: Map<key, OppEntry>
 * key = "SYM|longEx|shortEx"
 * OppEntry = {
 *   symbol, longEx, shortEx,
 *   firstSeen:  ms,
 *   lastViable: ms,   // last tick where viable=true
 *   expiredAt:  ms|null,
 *   current:    number,
 *   peak:       number,
 *   history:    number[]   // net% per tick
 * }
 */
const activeOpps = new Map();

/**
 * oppHistory: HistEntry[]  (newest first)
 * HistEntry = { symbol, longEx, shortEx, peak, duration, endedAt }
 */
const oppHistory = [];

// ── SSE ────────────────────────────────────────────────────────────────────
const es = new EventSource('/api/stream');
es.onopen    = () => setLive(true);
es.onerror   = () => setLive(false);
es.onmessage = e  => { lastSnap = JSON.parse(e.data); render(lastSnap); };

function setLive(ok) {
  document.getElementById('live-dot').className = ok ? 'live-dot' : 'live-dot stale';
  document.getElementById('live-txt').textContent  = ok ? 'LIVE' : 'RECONNECTING';
}

// ── Clock ──────────────────────────────────────────────────────────────────
setInterval(() => {
  document.getElementById('clock').textContent = new Date().toTimeString().slice(0, 8);
}, 500);

// ── Funding countdown ──────────────────────────────────────────────────────
setInterval(() => {
  const now = Date.now();
  document.querySelectorAll('[data-settl]').forEach(el => {
    const ms = +el.dataset.settl - now;
    el.textContent = ms > 0 ? fmtCountdown(ms) : 'NOW';
  });
}, 1000);

// ── Duration + expiry refresh (runs independently of SSE) ──────────────────
setInterval(() => {
  const now = Date.now();
  // Live duration timers
  document.querySelectorAll('[data-since]').forEach(el => {
    el.textContent = fmtDuration(now - +el.dataset.since);
  });
  // "ended X s ago" timers
  document.querySelectorAll('[data-expired]').forEach(el => {
    el.textContent = 'ended ' + fmtDuration(now - +el.dataset.expired) + ' ago';
  });
  // History "X ago" timers
  document.querySelectorAll('[data-endedat]').forEach(el => {
    el.textContent = fmtAgo(now - +el.dataset.endedat);
  });
}, 500);

// ── Main render ────────────────────────────────────────────────────────────
function render(snap) {
  renderHeader(snap.health);
  renderSystemStats(snap.systemStats);
  renderHealth(snap.health);
  renderSpreads(snap.spreads);
  renderFunding(snap.prices);
  updateActiveOpps(snap.spreads);
  renderActiveOpps();
  updateDbSessions(snap.recentSessions || []);
  renderHistory();
  renderSymbolTabs(snap.prices);
  renderOrderBooks(snap.prices);
  renderStats(snap.stats);
}

// ── System stats banner ───────────────────────────────────────────────────
function renderSystemStats(s) {
  const el = document.getElementById('sys-stats-banner');
  if (!s) { el.innerHTML = ''; return; }

  const CIRC = 87.96; // 2π * r=14

  function ringColor(pct, isRam) {
    if (pct < 0) return 'var(--dim)';
    if (isRam) {
      if (pct > 85) return 'var(--red)';
      if (pct > 70) return 'var(--yellow)';
      return 'var(--blue)';
    }
    if (pct > 90) return 'var(--red)';
    if (pct > 70) return 'var(--yellow)';
    return 'var(--green)';
  }

  function ring(pct, isRam) {
    const col = ringColor(pct, isRam);
    const label = pct < 0 ? 'N/A' : Math.round(pct) + '%';
    const dash = pct < 0 ? 0 : (pct / 100) * CIRC;
    return `<div class="ss-ring">
      <svg viewBox="0 0 36 36" width="38" height="38">
        <circle cx="18" cy="18" r="14" fill="none" stroke="var(--bg3)" stroke-width="3"/>
        <circle cx="18" cy="18" r="14" fill="none" stroke="${col}" stroke-width="3"
          stroke-dasharray="${dash.toFixed(1)} ${CIRC}" stroke-linecap="round"/>
      </svg>
      <span class="ss-ring-pct" style="color:${col}">${label}</span>
    </div>`;
  }

  // CPU
  const cpuBot = s.cpuBotPct >= 0 ? `bot ${Math.round(s.cpuBotPct)}%` : '';
  const cpuSection = `<div class="ss-ring-wrap">
    <div class="ss-ring-col">
      <span class="ss-label">CPU</span>
      ${cpuBot ? `<span class="ss-sub">${cpuBot}</span>` : ''}
    </div>
    ${ring(s.cpuSysPct, false)}
  </div>`;

  // GPU
  const gpuSection = `<div class="ss-ring-wrap">
    <div class="ss-ring-col"><span class="ss-label">GPU</span></div>
    ${ring(s.gpuPct, false)}
  </div>`;

  // RAM
  const ramUsedPct = s.ramSysTotalGb > 0 ? (s.ramSysUsedGb / s.ramSysTotalGb) * 100 : 0;
  const ramCol = ringColor(ramUsedPct, true);
  const ramBotTxt = s.ramBotHeapMb > 0 ? `heap ${Math.round(s.ramBotHeapMb)} MB` : '';
  const ramSection = `<div class="ss-ram-wrap">
    <div class="ss-ram-top">
      <span class="ss-label">RAM</span>
      <span class="ss-ram-val" style="color:${ramCol}">${s.ramSysUsedGb.toFixed(1)} / ${s.ramSysTotalGb.toFixed(0)} GB</span>
    </div>
    <div class="ss-bar-track">
      <div class="ss-bar-fill" style="width:${ramUsedPct.toFixed(1)}%;background:${ramCol}"></div>
    </div>
    <div class="ss-ram-foot">
      <span class="ss-sub">${ramBotTxt}</span>
      <span class="ss-sub">${Math.round(ramUsedPct)}%</span>
    </div>
  </div>`;

  // Network
  const downPct = s.netMaxSeenMbps > 0 ? Math.min(100, (s.netDownMbps / s.netMaxSeenMbps) * 100) : 0;
  const netBarCol = s.netStatus === 'SAT' ? 'var(--red)' : s.netStatus === 'HIGH' ? 'var(--yellow)' : 'var(--green)';
  const badgeCls  = s.netStatus === 'SAT' ? 'ss-badge-sat' : s.netStatus === 'HIGH' ? 'ss-badge-hi' : 'ss-badge-ok';
  const netSection = `<div class="ss-net-wrap">
    <div class="ss-net-top">
      <span class="ss-label">NETWORK</span>
      <span class="ss-sub">session ${s.netSessionMb.toFixed(0)} MB</span>
    </div>
    <div class="ss-net-rates">
      <div class="ss-net-rate">
        <span style="color:var(--green);font-size:11px">↓</span>
        <span class="ss-net-val">${s.netDownMbps.toFixed(1)}</span>
        <span class="ss-net-unit">Mbps</span>
      </div>
      <div class="ss-net-rate">
        <span style="color:var(--yellow);font-size:11px">↑</span>
        <span class="ss-net-val">${s.netUpMbps.toFixed(1)}</span>
        <span class="ss-net-unit">Mbps</span>
      </div>
    </div>
    <div class="ss-net-bar-track">
      <div class="ss-net-bar-fill" style="width:${downPct.toFixed(1)}%;background:${netBarCol}"></div>
    </div>
    <div class="ss-net-foot">
      <span class="ss-sub">max ${s.netMaxSeenMbps.toFixed(1)} Mbps</span>
      <span class="ss-badge ${badgeCls}">NET ${s.netStatus}</span>
    </div>
  </div>`;

  el.innerHTML = [
    cpuSection,
    '<div class="ss-divider"></div>',
    gpuSection,
    '<div class="ss-divider"></div>',
    ramSection,
    '<div class="ss-divider"></div>',
    netSection
  ].join('');
}

// ── Header pills ──────────────────────────────────────────────────────────
function renderHeader(health) {
  document.getElementById('ex-pills').innerHTML = health.map(h => {
    const cls = !h.restAlive || h.dataStale ? 'dot-r' : 'dot-g';
    return `<div class="ex-pill"><div class="dot ${cls}"></div>${h.exchange.slice(0,3).toUpperCase()}</div>`;
  }).join('');
}

// ── Health cards ──────────────────────────────────────────────────────────
function renderHealth(health) {
  document.getElementById('health-row').innerHTML = health.map(h => {
    const cls    = h.dataStale || !h.restAlive ? 'bad' : h.wsAlive ? 'ok' : 'warn';
    const dotCol = cls === 'ok' ? 'var(--green)' : cls === 'warn' ? 'var(--yellow)' : 'var(--red)';
    const status = h.dataStale ? 'STALE' : !h.restAlive ? 'REST DOWN' : h.wsAlive ? 'LIVE' : 'WS DOWN';
    const wsAge  = h.lastWsTickAgeMs >= 0 ? (h.lastWsTickAgeMs / 1000).toFixed(1) + 's' : '—';
    const lat    = h.restLatencyMs >= 0 ? h.restLatencyMs + 'ms' : '—';
    return `<div class="health-card ${cls}">
      <div class="h-dot" style="background:${dotCol}"></div>
      <div>
        <div class="h-name">${h.exchange.toUpperCase()}</div>
        <div class="h-status">${status}</div>
      </div>
      <div class="h-meta">REST ${lat}<br>WS ${wsAge} ago</div>
    </div>`;
  }).join('');
}

// ── Spread table ──────────────────────────────────────────────────────────
function renderSpreads(spreads) {
  document.getElementById('spreads-body').innerHTML = spreads.slice(0, 60).map(r => {
    const cls    = r.viable ? 'row-viable' : r.netSpreadPct < 0 ? 'row-neg' : '';
    const netCls = r.netSpreadPct > 0.05 ? 'net-pos' : r.netSpreadPct > 0 ? 'net-dim' : 'net-neg';
    const vol    = r.maxVolumeUsdt > 0 ? fmtUsdt(r.maxVolumeUsdt) : '—';
    const volCls = r.maxVolumeUsdt >= 50000 ? 'style="color:var(--green)"'
                 : r.maxVolumeUsdt >= 10000 ? 'style="color:var(--yellow)"'
                 : 'style="color:var(--dim)"';
    return `<tr class="${cls}">
      <td><b style="color:var(--teal)">${r.symbol}</b></td>
      <td>${r.longExchange}</td>
      <td>${r.shortExchange}</td>
      <td style="color:var(--dim)">${r.grossSpreadPct.toFixed(3)}%</td>
      <td class="${netCls}">${r.netSpreadPct.toFixed(3)}%</td>
      <td ${volCls}>${vol}</td>
    </tr>`;
  }).join('');
}

// ── Funding grid ──────────────────────────────────────────────────────────
function renderFunding(prices) {
  const exchanges = [...new Set(prices.flatMap(s => s.funding.map(f => f.exchange)))];
  let html = `<div class="fund-grid" style="grid-template-columns:70px ${exchanges.map(() => '1fr').join(' ')}">`;
  html += `<div class="fund-cell fund-hdr"></div>`;
  exchanges.forEach(ex => { html += `<div class="fund-cell fund-hdr">${ex.toUpperCase()}</div>`; });
  prices.forEach(sym => {
    html += `<div class="fund-cell fund-hdr" style="text-align:left;padding-left:10px">${sym.symbol}</div>`;
    exchanges.forEach(ex => {
      const f = sym.funding.find(x => x.exchange === ex);
      if (!f) { html += `<div class="fund-cell"><span class="fv-zero">—</span></div>`; return; }
      const pct = (f.currentRate * 100).toFixed(4);
      const cls = f.currentRate > 0.0001 ? 'fv-pos' : f.currentRate < -0.0001 ? 'fv-neg' : 'fv-zero';
      const cd  = f.nextSettlementMs > 0
        ? `<div class="fund-cd" data-settl="${f.nextSettlementMs}">${fmtCountdown(f.nextSettlementMs - Date.now())}</div>`
        : '';
      html += `<div class="fund-cell"><div class="${cls}">${pct}%</div>${cd}</div>`;
    });
  });
  html += '</div>';
  document.getElementById('funding-grid').innerHTML = html;
}

// ── Active opportunity tracking ────────────────────────────────────────────
function updateActiveOpps(spreads) {
  const now  = Date.now();
  const seen = new Set();

  // Update / create active entries
  for (const r of spreads) {
    if (!r.viable) continue;
    const key = `${r.symbol}|${r.longExchange}|${r.shortExchange}`;
    seen.add(key);
    if (!activeOpps.has(key)) {
      activeOpps.set(key, {
        symbol: r.symbol, longEx: r.longExchange, shortEx: r.shortExchange,
        firstSeen: now, lastViable: now, expiredAt: null,
        current: r.netSpreadPct, peak: r.netSpreadPct,
        history: []
      });
    }
    const o    = activeOpps.get(key);
    o.lastViable = now;
    o.expiredAt  = null;          // still alive — clear any pending expiry
    o.current    = r.netSpreadPct;
    o.history.push(r.netSpreadPct);
    if (o.history.length > MAX_HIST_TICKS) o.history.shift();
    o.peak = Math.max(...o.history);
  }

  // Mark disappeared entries as expired; promote fully-expired ones to history
  for (const [key, o] of activeOpps) {
    if (seen.has(key)) continue;

    if (!o.expiredAt) {
      // Transition: viable → expired
      o.expiredAt = now;
    } else if (now - o.expiredAt >= EXPIRED_DISPLAY_MS) {
      // Done cooling down — push to history and remove
      oppHistory.unshift({
        symbol:   o.symbol,
        longEx:   o.longEx,
        shortEx:  o.shortEx,
        peak:     o.peak,
        duration: o.expiredAt - o.firstSeen,   // active window only
        endedAt:  o.expiredAt
      });
      if (oppHistory.length > MAX_HISTORY_ROWS) oppHistory.pop();
      activeOpps.delete(key);
    }
  }
}

// ── Active opportunities render ────────────────────────────────────────────
function renderActiveOpps() {
  const el = document.getElementById('opps-inner');
  if (activeOpps.size === 0) {
    el.innerHTML = '<div class="no-opps">No active opportunities above threshold</div>';
    return;
  }

  // Sort: live first (by current net desc), then expired (by expiredAt desc)
  const entries = [...activeOpps.values()].sort((a, b) => {
    const aLive = !a.expiredAt, bLive = !b.expiredAt;
    if (aLive !== bLive) return aLive ? -1 : 1;
    return aLive ? b.current - a.current : b.expiredAt - a.expiredAt;
  });

  let html = `<table class="opp-table">
    <thead><tr>
      <th>SYMBOL</th><th>DIRECTION</th>
      <th>NET %</th><th>PEAK %</th>
      <th>STATUS</th><th style="min-width:110px">NET HISTORY</th>
    </tr></thead><tbody>`;

  for (const o of entries) {
    const live = !o.expiredAt;
    if (live) {
      const netCol = o.current >= 0.15 ? 'var(--green)' : 'var(--yellow)';
      html += `<tr class="opp-active">
        <td class="opp-sym">${o.symbol}</td>
        <td class="opp-pair">${o.longEx} <span style="color:var(--dim)">→</span> ${o.shortEx}</td>
        <td style="color:${netCol};font-weight:bold">${o.current.toFixed(3)}%</td>
        <td style="color:var(--teal)">${o.peak.toFixed(3)}%</td>
        <td style="color:var(--dim)" data-since="${o.firstSeen}">${fmtDuration(Date.now() - o.firstSeen)}</td>
        <td>${oppSpark(o.history)}</td>
      </tr>`;
    } else {
      html += `<tr class="opp-expired">
        <td class="opp-sym" style="color:var(--dim)">${o.symbol}</td>
        <td class="opp-pair">${o.longEx} <span style="color:var(--dim)">→</span> ${o.shortEx}</td>
        <td style="color:var(--dim)">${o.current.toFixed(3)}%</td>
        <td style="color:var(--dim)">${o.peak.toFixed(3)}%</td>
        <td style="color:var(--dim)" data-expired="${o.expiredAt}">ended ${fmtDuration(Date.now() - o.expiredAt)} ago</td>
        <td>${oppSpark(o.history, true)}</td>
      </tr>`;
    }
  }
  html += '</tbody></table>';
  el.innerHTML = html;
}

// ── DB session sync ────────────────────────────────────────────────────────
function updateDbSessions(sessions) {
  for (const s of sessions) dbSessions.set(s.id, s);
}

// ── History render (DB-backed, persists across restarts) ───────────────────
function renderHistory() {
  const wrap = document.getElementById('history-wrap');
  const dbList = [...dbSessions.values()]
    .sort((a, b) => b.endedAtMs - a.endedAtMs)
    .slice(0, 100);
  const dbIds = new Set(dbList.map(s => s.id));
  const jsList = oppHistory.filter(h => !h.dbId || !dbIds.has(h.dbId));

  const all = [
    ...dbList.map(s => ({
      symbol: s.symbol, longEx: s.longExchange, shortEx: s.shortExchange,
      peak: s.peakNetPct, avg: s.avgNetPct, min: s.minNetPct,
      entry: s.entryNetPct, exit: s.exitNetPct,
      peakVol: s.peakVolumeUsdt, avgVol: s.avgVolumeUsdt,
      duration: s.durationMs, endedAt: s.endedAtMs, ticks: s.tickCount, fromDb: true
    })),
    ...jsList.map(h => ({
      symbol: h.symbol, longEx: h.longEx, shortEx: h.shortEx,
      peak: h.peak, avg: null, min: null, entry: null, exit: null,
      peakVol: null, avgVol: null,
      duration: h.duration, endedAt: h.endedAt, ticks: null, fromDb: false
    }))
  ].sort((a, b) => b.endedAt - a.endedAt).slice(0, 100);

  if (all.length === 0) {
    wrap.innerHTML = '<div class="no-opps">No completed opportunities yet</div>';
    return;
  }
  let html = `<table class="opp-table">
    <thead><tr>
      <th>SYMBOL</th><th>DIRECTION</th>
      <th>ENTRY%</th><th>PEAK%</th><th>AVG%</th><th>MIN%</th><th>EXIT%</th>
      <th>PEAK VOL</th><th>AVG VOL</th>
      <th>DURATION</th><th>TICKS</th><th>ENDED</th>
    </tr></thead><tbody>`;
  for (const h of all) {
    const peakCol  = h.peak >= 0.15 ? 'var(--green)' : h.peak >= 0.05 ? 'var(--yellow)' : 'var(--dim)';
    const entryStr = h.entry != null ? h.entry.toFixed(3) + '%' : '—';
    const avgStr   = h.avg   != null ? h.avg.toFixed(3) + '%' : '—';
    const minStr   = h.min   != null ? h.min.toFixed(3) + '%' : '—';
    const exitStr  = h.exit  != null ? h.exit.toFixed(3) + '%' : '—';
    const ticks    = h.ticks != null ? h.ticks.toLocaleString() : '—';
    const peakVol  = h.peakVol != null && h.peakVol > 0 ? fmtUsdt(h.peakVol) : '—';
    const avgVol   = h.avgVol  != null && h.avgVol  > 0 ? fmtUsdt(h.avgVol)  : '—';
    const peakVolCls = h.peakVol >= 50000 ? 'color:var(--green)' : h.peakVol >= 10000 ? 'color:var(--yellow)' : 'color:var(--dim)';
    html += `<tr>
      <td class="opp-sym">${h.symbol}</td>
      <td class="opp-pair">${h.longEx} <span style="color:var(--dim)">→</span> ${h.shortEx}</td>
      <td style="color:var(--dim)">${entryStr}</td>
      <td style="color:${peakCol};font-weight:bold">${h.peak.toFixed(3)}%</td>
      <td style="color:var(--dim)">${avgStr}</td>
      <td style="color:var(--dim)">${minStr}</td>
      <td style="color:var(--dim)">${exitStr}</td>
      <td style="${peakVolCls}">${peakVol}</td>
      <td style="color:var(--dim)">${avgVol}</td>
      <td style="color:var(--dim)">${fmtDuration(h.duration)}</td>
      <td style="color:var(--dim)">${ticks}</td>
      <td style="color:var(--dim)" data-endedat="${h.endedAt}">${fmtAgo(Date.now() - h.endedAt)}</td>
    </tr>`;
  }
  html += '</tbody></table>';
  wrap.innerHTML = html;
}

// ── Opportunity sparkline ──────────────────────────────────────────────────
function oppSpark(hist, faded) {
  if (hist.length < 2) return '';
  const mn  = Math.max(0, Math.min(...hist) * 0.95);
  const mx  = Math.max(...hist) * 1.05;
  const rng = mx - mn || 0.001;
  const W = 110, H = 28;
  const pts = hist.map((v, i) =>
    `${((i / (hist.length - 1)) * W).toFixed(1)},${(H - ((v - mn) / rng * (H - 4)) - 2).toFixed(1)}`
  ).join(' ');
  const color = faded ? 'var(--dim)' : 'var(--green)';
  return `<svg viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" style="display:block">
    <polyline points="${pts}" fill="none" stroke="${color}" stroke-width="1.5" stroke-linejoin="round"/>
  </svg>`;
}

// ── Order books ────────────────────────────────────────────────────────────
function renderSymbolTabs(prices) {
  const syms = prices.map(s => s.symbol).join(',');
  if (!obSymbol || !prices.find(s => s.symbol === obSymbol)) obSymbol = prices[0]?.symbol;
  if (syms === lastSymList) return;
  lastSymList = syms;
  document.getElementById('ob-sym-tabs').innerHTML = prices.map(s =>
    `<div class="sym-tab ${s.symbol === obSymbol ? 'active' : ''}"
          onclick="selectSym('${s.symbol}')">${s.symbol}</div>`
  ).join('');
}

function selectSym(sym) {
  obSymbol = sym;
  document.querySelectorAll('.sym-tab').forEach(t =>
    t.classList.toggle('active', t.textContent.trim() === sym));
  if (lastSnap) renderOrderBooks(lastSnap.prices);
}

function renderOrderBooks(prices) {
  const sym = prices.find(s => s.symbol === obSymbol);
  if (!sym) return;
  document.getElementById('ob-books').innerHTML = sym.ticks.map(t => buildBook(t)).join('');
}

function buildBook(t) {
  const N    = 10;
  const asks = (t.topAsks || []).slice(0, N);   // best ask first (lowest price)
  const bids = (t.topBids || []).slice(0, N);   // best bid first (highest price)

  // Cumulative from best → worst
  let s = 0;
  const askCum = asks.map(([, q]) => (s += q, s));
  s = 0;
  const bidCum = bids.map(([, q]) => (s += q, s));
  const maxAsk = askCum[askCum.length - 1] || 1;
  const maxBid = bidCum[bidCum.length - 1] || 1;

  // Asks: display reversed (worst at top, best at bottom)
  const askRows = [...asks].reverse().map(([p, q], di) => {
    const origIdx = asks.length - 1 - di;
    const depth   = (askCum[origIdx] / maxAsk * 100).toFixed(1) + '%';
    return `<div class="ob-row ask-row" style="--d:${depth}">
      <span class="ask-price">${fmtPrice(p)}</span>
      <span class="ob-qty">${fmtQty(q)}</span>
      <span class="ob-total">${fmtQty(askCum[origIdx])}</span>
    </div>`;
  }).join('');

  // Spread indicator
  const bestAsk = asks[0]?.[0] || 0;
  const bestBid = bids[0]?.[0] || 0;
  const spreadAbs = bestAsk && bestBid ? fmtPrice(bestAsk - bestBid) : '—';
  const spreadPct = bestAsk && bestBid ? ((bestAsk - bestBid) / bestAsk * 100).toFixed(3) + '%' : '';

  // Bids: best at top, worst at bottom
  const bidRows = bids.map(([p, q], i) => {
    const depth = (bidCum[i] / maxBid * 100).toFixed(1) + '%';
    return `<div class="ob-row bid-row" style="--d:${depth}">
      <span class="bid-price">${fmtPrice(p)}</span>
      <span class="ob-qty">${fmtQty(q)}</span>
      <span class="ob-total">${fmtQty(bidCum[i])}</span>
    </div>`;
  }).join('');

  const bidDep = t.bidDepthUsdt > 0 ? fmtUsdt(t.bidDepthUsdt) : '';
  const askDep = t.askDepthUsdt > 0 ? fmtUsdt(t.askDepthUsdt) : '';
  const depStr = (bidDep || askDep)
    ? `<p style="font-size:9px;color:var(--dim);font-weight:normal">bid:${bidDep}</p> <p style="font-size:9px;color:var(--dim);font-weight:normal">ask:${askDep}</p>`
    : '';

  return `<div class="ob-panel">
    <div class="ob-ex-hdr">${t.exchange.toUpperCase()}${depStr}</div>
    <div class="ob-col-hdr"><span>PRICE</span><span>QTY</span><span>TOTAL</span></div>
    <div class="ob-asks">${askRows}</div>
    <div class="ob-mid">
      <span class="ob-mid-price">${bestBid ? fmtPrice(bestBid) : '—'}</span>
      <span class="ob-mid-spread">${spreadAbs}${spreadPct ? ' · ' + spreadPct : ''}</span>
    </div>
    <div class="ob-bids">${bidRows}</div>
  </div>`;
}

// ── Stats ─────────────────────────────────────────────────────────────────
function renderStats(stats) {
  if (!stats) return;
  const items = [
    { val: stats.totalOpportunities,             lbl: 'TOTAL OPPS' },
    { val: stats.maxNetSpreadPct.toFixed(3) + '%', lbl: 'MAX NET' },
    { val: stats.avgNetSpreadPct.toFixed(3) + '%', lbl: 'AVG NET' },
    { val: Object.keys(stats.countBySymbol || {}).length,       lbl: 'SYMBOLS' },
    { val: Object.keys(stats.countByExchangePair || {}).length,  lbl: 'PAIRS' },
  ];
  document.getElementById('stats-bar').innerHTML = items.map(c =>
    `<div class="stat-cell">
      <div class="stat-val">${c.val}</div>
      <div class="stat-lbl">${c.lbl}</div>
    </div>`
  ).join('');
}

// ── Formatters ────────────────────────────────────────────────────────────
function fmtUsdt(v) {
  if (v >= 1e6)  return '$' + (v / 1e6).toFixed(1) + 'M';
  if (v >= 1000) return '$' + (v / 1000).toFixed(0) + 'K';
  return '$' + v.toFixed(0);
}
function fmtPrice(p) {
  if (!p) return '—';
  return p >= 10000 ? p.toFixed(1)
       : p >= 100   ? p.toFixed(2)
       : p >= 1     ? p.toFixed(4)
       : p.toFixed(5);
}
function fmtQty(q) {
  if (q >= 1e6) return (q / 1e6).toFixed(2) + 'M';
  if (q >= 1e3) return (q / 1e3).toFixed(2) + 'K';
  return q >= 10 ? q.toFixed(1) : q.toFixed(3);
}
function fmtCountdown(ms) {
  if (ms <= 0) return 'NOW';
  const h = Math.floor(ms / 3600000);
  const m = Math.floor((ms % 3600000) / 60000);
  const s = Math.floor((ms % 60000) / 1000);
  return h > 0 ? `${h}h ${String(m).padStart(2,'0')}m`
               : `${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
}
function fmtDuration(ms) {
  if (ms < 1000)    return '<1s';
  if (ms < 60000)   return Math.floor(ms / 1000) + 's';
  if (ms < 3600000) return Math.floor(ms / 60000) + 'm ' + Math.floor((ms % 60000) / 1000) + 's';
  return Math.floor(ms / 3600000) + 'h';
}
function fmtAgo(ms) {
  if (ms < 60000)   return Math.floor(ms / 1000) + 's ago';
  if (ms < 3600000) return Math.floor(ms / 60000) + 'm ago';
  return Math.floor(ms / 3600000) + 'h ago';
}
