arbbot {
  exchanges {
    binance {
      enabled = true
      restBaseUrl = "https://fapi.binance.com"
      wsBaseUrl = "wss://fstream.binance.com"
      apiKey = ${?BINANCE_API_KEY}
      apiSecret = ${?BINANCE_API_SECRET}
      feeRefreshIntervalMinutes = 30
      fundingRateRefreshIntervalMinutes = 5
    }
    kucoin {
      enabled = true
      restBaseUrl = "https://api-futures.kucoin.com"
      wsBaseUrl = "wss://ws-api-futures.kucoin.com/endpoint"
      apiKey = ${?KUCOIN_API_KEY}
      apiSecret = ${?KUCOIN_API_SECRET}
      apiPassphrase = ${?KUCOIN_API_PASSPHRASE}
      feeRefreshIntervalMinutes = 30
      fundingRateRefreshIntervalMinutes = 5
    }
    bybit {
      enabled = true
      restBaseUrl = "https://api.bybit.com"
      wsBaseUrl = "wss://stream.bybit.com/v5/public/linear"
      apiKey = ${?BYBIT_API_KEY}
      apiSecret = ${?BYBIT_API_SECRET}
      feeRefreshIntervalMinutes = 30
      fundingRateRefreshIntervalMinutes = 5
    }
    okx {
      enabled = true
      restBaseUrl = "https://www.okx.com"
      wsBaseUrl = "wss://ws.okx.com:8443/ws/v5/public"
      apiKey = ${?OKX_API_KEY}
      apiSecret = ${?OKX_API_SECRET}
      apiPassphrase = ${?OKX_API_PASSPHRASE}
      feeRefreshIntervalMinutes = 30
      fundingRateRefreshIntervalMinutes = 5
    }
    gate {
      enabled = true
      restBaseUrl = "https://api.gateio.ws/api/v4"
      wsBaseUrl = "wss://fx-ws.gateio.ws/v4/ws/usdt"
      apiKey = ${?GATE_API_KEY}
      apiSecret = ${?GATE_API_SECRET}
      feeRefreshIntervalMinutes = 30
      fundingRateRefreshIntervalMinutes = 5
    }
    bitget {
      enabled = true
      restBaseUrl = "https://api.bitget.com/api/v2"
      wsBaseUrl = "wss://ws.bitget.com/v2/ws/public"
      apiKey = ${?BITGET_API_KEY}
      apiSecret = ${?BITGET_API_SECRET}
      apiPassphrase = ${?BITGET_API_PASSPHRASE}
      feeRefreshIntervalMinutes = 30
      fundingRateRefreshIntervalMinutes = 5
    }
    htx {
      enabled = true
      restBaseUrl = "https://api.hbdm.com"
      wsBaseUrl = "wss://api.hbdm.com/linear-swap-ws"
      apiKey = ${?HTX_API_KEY}
      apiSecret = ${?HTX_API_SECRET}
      feeRefreshIntervalMinutes = 30
      fundingRateRefreshIntervalMinutes = 5
    }
  }
  scanner {
    minNetSpreadPercent = 0.05
    maxGrossSpreadPercent = 3.0
    orderSizeUsdt = 1000
    scanIntervalMs = 50
    symbols = ["BTC", "ETH", "SOL", "BNB", "XRP",
               "DOGE", "LINK", "AVAX", "ADA", "DOT",
               "LTC", "TRX", "SUI", "APT", "NEAR",
               "TON", "UNI", "ATOM", "HBAR", "OP",
               "AAVE", "ALGO", "ARB",  "AXS", "BCH",
               "CRV",  "DYDX", "ENA",  "ETC", "FIL",
               "GRT",  "ICP",  "INJ",  "JUP", "LDO",
               "ONDO", "ORDI", "PENDLE","POL", "PYTH",
               "SAND", "SEI",  "TAO",  "TIA", "VIRTUAL",
               "W",    "WIF",  "WLD",  "XLM", "ZK"]
  }
  risk {
    maxFundingRatePercent = 0.1
    minFundingTimeBufferMinutes = 5
  }
  health {
    checkIntervalSeconds = 30
    wsStaleThresholdMs = 2000
    endpointTimeoutMs = 5000
  }
  storage {
    dbPath = "data/opportunities.db"
    dbPath = ${?arbbot.storage.dbPath}
    flushIntervalMs = 1000
  }
  dashboard {
    enabled = true
    port = 8080
  }
}
